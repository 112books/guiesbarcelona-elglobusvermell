<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria de fotos — Guies Barcelona</title>
  <style>
    :root {
      --bg:      #f5f4f0;
      --ink:     #111110;
      --ink2:    #444440;
      --ink3:    #6b6b66;
      --border:  #ddddd8;
      --surface: #eeede9;
      --red:     #c81e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── Capçalera ─────────────────────────────────────────────── */
    .g-header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .g-header a { display: inline-block; }
    .g-header img { height: 3.5rem; width: auto; }
    .g-header h1 {
      margin-top: 0.85rem;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--ink3);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── Barra de controls ─────────────────────────────────────── */
    .g-controls {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .g-search {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .g-filter {
      display: flex;
      border: 1px solid var(--border);
      background: #fff;
    }
    .g-filter button {
      border: none;
      background: none;
      padding: 0.5rem 0.85rem;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--ink3);
      cursor: pointer;
      border-right: 1px solid var(--border);
    }
    .g-filter button:last-child { border-right: none; }
    .g-filter button.active { background: var(--red); color: #fff; }
    .g-count {
      font-size: 0.78rem;
      color: var(--ink3);
      white-space: nowrap;
    }

    /* ── Graella ───────────────────────────────────────────────── */
    .g-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1px;
      background: var(--border);
      padding: 1px;
    }
    .g-card {
      background: #fff;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--ink);
      transition: box-shadow 0.15s ease;
    }
    .g-card:hover { box-shadow: inset 0 0 0 2px var(--red); }
    .g-thumb {
      aspect-ratio: 1;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .g-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .g-thumb .g-no-photo {
      font-size: 0.68rem;
      color: var(--ink3);
      text-align: center;
      padding: 0.5rem;
      letter-spacing: 0.03em;
    }
    .g-label {
      padding: 0.5rem 0.6rem;
      font-size: 0.72rem;
      line-height: 1.35;
      color: var(--ink2);
      flex: 1;
    }

    .g-empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--ink3);
      font-size: 0.85rem;
    }

    /* ── Peu ───────────────────────────────────────────────────── */
    .g-footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem 1rem;
      text-align: center;
      font-size: 0.72rem;
      color: #bbb;
    }
    .g-footer a { color: #bbb; text-decoration: none; }
    .g-footer a:hover { color: var(--red); }

    .g-help-btn {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 9999;
      background: var(--red);
      color: #fff;
      border: none;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: background 0.2s;
      font-family: system-ui, sans-serif;
    }
    .g-help-btn:hover { background: #a01818; }
  </style>
</head>
<body>

  <a href="../guia/" target="_blank" rel="noopener"
     class="g-help-btn" aria-label="Guia de l'editor">?</a>

  <header class="g-header">
    <a href="../../" aria-label="Inici — Guies de Barcelona">
      <img src="../../img/Arquitectura-i-urbanisme-de-barcelona.svg"
           alt="Guies de Barcelona de El Globus Vermell">
    </a>
    <h1>Galeria de fotos</h1>
  </header>

  <div class="g-controls">
    <input type="search" class="g-search" id="cerca" placeholder="Cerca per nom o adreça…">
    <div class="g-filter" role="group" aria-label="Filtrar per estat de la foto">
      <button data-filter="totes" class="active">Totes</button>
      <button data-filter="amb">Amb foto</button>
      <button data-filter="sense">Sense foto</button>
    </div>
    <div class="g-count" id="comptador"></div>
  </div>

  <main>
    <div class="g-grid" id="graella"></div>
    <div class="g-empty" id="buit" hidden>Cap resultat amb aquest filtre/cerca.</div>
  </main>

  <footer class="g-footer">
    <div>
      © <span id="year"></span><script>document.getElementById('year').textContent = new Date().getFullYear();</script>
      <a href="https://elglobusvermell.org" target="_blank" rel="noopener">El Globus Vermell</a>
      &nbsp;·&nbsp;
      <a href="../">← Tornar a l'administrador</a>
    </div>
  </footer>

  <script>
    let dades = [];
    let filtreActual = 'totes';

    /* Les fotos venen com a rutes arrel ("/img/elements/...") pensades pel
       domini de producció. A la versió de proves (GitHub Pages, servida
       sota /guiesbarcelona-elglobusvermell/) cal el mateix prefix que la
       resta del lloc, que no tenim perquè aquesta pàgina és HTML estàtic
       fora del pipeline de Hugo. El deduïm de la pròpia URL. */
    const BASE_PATH = location.pathname.replace(/\/admin\/galeria\/?$/, '');

    function urlFoto(foto) {
      return foto ? BASE_PATH + foto : foto;
    }

    function render() {
      const q = document.getElementById('cerca').value.trim().toLowerCase();
      const graella = document.getElementById('graella');
      const buit = document.getElementById('buit');
      const comptador = document.getElementById('comptador');

      const filtrats = dades.filter(item => {
        if (filtreActual === 'amb' && !item.foto) return false;
        if (filtreActual === 'sense' && item.foto) return false;
        if (q && !item.title.toLowerCase().includes(q) && !item.slug.includes(q)) return false;
        return true;
      });

      comptador.textContent = `${filtrats.length} de ${dades.length}`;
      buit.hidden = filtrats.length > 0;
      graella.innerHTML = filtrats.map(item => `
        <a class="g-card" href="../cms/#/collections/elements/entries/${item.slug}" title="Editar ${item.title}">
          <div class="g-thumb">
            ${item.foto
              ? `<img src="${urlFoto(item.foto)}" alt="${item.title}" loading="lazy">`
              : `<span class="g-no-photo">Sense foto</span>`}
          </div>
          <div class="g-label">${item.title}</div>
        </a>
      `).join('');
    }

    document.getElementById('cerca').addEventListener('input', render);
    document.querySelectorAll('.g-filter button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.g-filter button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtreActual = btn.dataset.filter;
        render();
      });
    });

    fetch('dades.json')
      .then(r => r.json())
      .then(data => { dades = data; render(); })
      .catch(() => {
        document.getElementById('graella').innerHTML =
          '<div class="g-empty">No s\'han pogut carregar les dades (dades.json).</div>';
      });
  </script>

</body>
</html>
