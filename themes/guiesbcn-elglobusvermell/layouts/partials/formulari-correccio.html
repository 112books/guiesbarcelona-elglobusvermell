{{/* Formulari "Suggerir una correcció" — inclòs a /contacte/ i a /presentacio/ */}}
<section class="contacte-seccio" aria-labelledby="form-correccio-titol">
  <h2 id="form-correccio-titol">Suggerir una correcció</h2>
  <p class="contacte-seccio-desc">Heu detectat un error en una fitxa d'edifici? Nom d'arquitecte incorrecte, adreça inexacta, data equivocada...? Feu-nos-ho saber.</p>
  <form
    id="form-correccio"
    class="contacte-form"
    method="post"
    action="{{ "contacte/envia.php" | relURL }}"
    novalidate
  >
    <input type="hidden" name="tipus" value="correccio">

    <div class="form-grup">
      <label class="form-label" for="r-nom">Nom i cognoms <span class="form-requerit" aria-hidden="true">*</span></label>
      <input
        class="form-input"
        type="text"
        id="r-nom"
        name="nom"
        autocomplete="name"
        required
        aria-required="true"
        maxlength="120"
      >
      <span class="form-error" id="r-nom-error" role="alert"></span>
    </div>

    <div class="form-grup">
      <label class="form-label" for="r-email">Correu electrònic <span class="form-requerit" aria-hidden="true">*</span></label>
      <input
        class="form-input"
        type="email"
        id="r-email"
        name="email"
        autocomplete="email"
        required
        aria-required="true"
        maxlength="254"
      >
      <span class="form-error" id="r-email-error" role="alert"></span>
    </div>

    <div class="form-grup">
      <label class="form-label" for="r-edifici">Edifici o element afectat <span class="form-requerit" aria-hidden="true">*</span></label>
      <input
        class="form-input"
        type="text"
        id="r-edifici"
        name="edifici"
        required
        aria-required="true"
        maxlength="200"
        placeholder="Nom de l'edifici tal com apareix a la web"
      >
      <span class="form-error" id="r-edifici-error" role="alert"></span>
    </div>

    <div class="form-grup">
      <label class="form-label" for="r-correccio">Descripció de la correcció <span class="form-requerit" aria-hidden="true">*</span></label>
      <textarea
        class="form-input form-textarea"
        id="r-correccio"
        name="correccio"
        required
        aria-required="true"
        maxlength="2000"
        rows="5"
        placeholder="Descriviu l'error i, si és possible, indiqueu la informació correcta i la font."
      ></textarea>
      <span class="form-error" id="r-correccio-error" role="alert"></span>
    </div>

    <div class="form-grup form-grup--rgpd">
      <label class="form-check-label">
        <input
          class="form-check"
          type="checkbox"
          id="r-rgpd"
          name="rgpd"
          required
          aria-required="true"
        >
        <span>He llegit i accepto la <a href="{{ "legal/privacitat/" | relLangURL }}">política de privacitat</a>. Les dades facilitades s'usaran únicament per gestionar la correcció i no es cediran a tercers. <span class="form-requerit" aria-hidden="true">*</span></span>
      </label>
      <span class="form-error" id="r-rgpd-error" role="alert"></span>
    </div>

    {{/* Honeypot anti-spam */}}
    <div class="form-honeypot" aria-hidden="true">
      <label for="r-web">No ompliu aquest camp</label>
      <input type="text" id="r-web" name="web" tabindex="-1" autocomplete="off">
    </div>

    <div class="form-accions">
      <button class="form-btn" type="submit">Enviar correcció</button>
      <p class="form-nota"><span class="form-requerit" aria-hidden="true">*</span> Camps obligatoris</p>
    </div>
  </form>
</section>

<script>
(function () {
  'use strict';

  function validaEmail(val) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val.trim());
  }

  function mostrarError(input, errorEl, missatge) {
    input.setAttribute('aria-invalid', 'true');
    input.setAttribute('aria-describedby', errorEl.id);
    errorEl.textContent = missatge;
  }

  function netejaError(input, errorEl) {
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    errorEl.textContent = '';
  }

  function validaCamp(input, errorEl) {
    const val = input.value;
    if (input.type === 'checkbox') {
      if (!input.checked) {
        mostrarError(input, errorEl, 'Cal acceptar la política de privacitat per continuar.');
        return false;
      }
    } else if (!val.trim()) {
      mostrarError(input, errorEl, 'Aquest camp és obligatori.');
      return false;
    } else if (input.type === 'email' && !validaEmail(val)) {
      mostrarError(input, errorEl, 'Introduïu una adreça de correu electrònic vàlida.');
      return false;
    } else if (input.maxLength > 0 && val.length > input.maxLength) {
      mostrarError(input, errorEl, `Màxim ${input.maxLength} caràcters.`);
      return false;
    }
    netejaError(input, errorEl);
    return true;
  }

  const form = document.getElementById('form-correccio');
  if (!form) return;

  const camps = [
    { id: 'r-nom',      errorId: 'r-nom-error'      },
    { id: 'r-email',    errorId: 'r-email-error'    },
    { id: 'r-edifici',  errorId: 'r-edifici-error'  },
    { id: 'r-correccio',errorId: 'r-correccio-error' },
    { id: 'r-rgpd',     errorId: 'r-rgpd-error'     },
  ];

  camps.forEach(function (cfg) {
    const input = document.getElementById(cfg.id);
    const errorEl = document.getElementById(cfg.errorId);
    if (!input || !errorEl) return;
    input.addEventListener('blur', function () { validaCamp(input, errorEl); });
    input.addEventListener('input', function () {
      if (input.getAttribute('aria-invalid') === 'true') {
        validaCamp(input, errorEl);
      }
    });
  });

  form.addEventListener('submit', function (e) {
    let valid = true;

    /* Honeypot: si el camp ocult té valor, és un bot */
    const honeypot = form.querySelector('input[name="web"]');
    if (honeypot && honeypot.value) {
      e.preventDefault();
      return;
    }

    camps.forEach(function (cfg) {
      const input = document.getElementById(cfg.id);
      const errorEl = document.getElementById(cfg.errorId);
      if (!input || !errorEl) return;
      if (!validaCamp(input, errorEl)) valid = false;
    });

    if (!valid) {
      e.preventDefault();
      const primerError = form.querySelector('[aria-invalid="true"]');
      if (primerError) primerError.focus();
    }
  });
}());
</script>
