{{ define "main" }}
<main class="pagina-contingut contacte-pagina">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="contacte-intro">{{ . }}</div>{{ end }}

  {{/* ── Formulari de contacte general ── */}}
  <section class="contacte-seccio" aria-labelledby="form-contacte-titol">
    <h2 id="form-contacte-titol">Contacte</h2>
    <form
      id="form-contacte"
      class="contacte-form"
      method="post"
      action="{{ "contacte/envia.php" | relURL }}"
      novalidate
    >
      <input type="hidden" name="tipus" value="contacte">

      <div class="form-grup">
        <label class="form-label" for="c-nom">Nom i cognoms <span class="form-requerit" aria-hidden="true">*</span></label>
        <input
          class="form-input"
          type="text"
          id="c-nom"
          name="nom"
          autocomplete="name"
          required
          maxlength="120"
        >
        <span class="form-error" id="c-nom-error" role="alert"></span>
      </div>

      <div class="form-grup">
        <label class="form-label" for="c-email">Correu electrònic <span class="form-requerit" aria-hidden="true">*</span></label>
        <input
          class="form-input"
          type="email"
          id="c-email"
          name="email"
          autocomplete="email"
          required
          maxlength="254"
        >
        <span class="form-error" id="c-email-error" role="alert"></span>
      </div>

      <div class="form-grup">
        <label class="form-label" for="c-missatge">Missatge <span class="form-requerit" aria-hidden="true">*</span></label>
        <textarea
          class="form-input form-textarea"
          id="c-missatge"
          name="missatge"
          required
          maxlength="2000"
          rows="6"
        ></textarea>
        <span class="form-error" id="c-missatge-error" role="alert"></span>
      </div>

      <div class="form-grup form-grup--rgpd">
        <label class="form-check-label">
          <input
            class="form-check"
            type="checkbox"
            id="c-rgpd"
            name="rgpd"
            required
          >
          <span>He llegit i accepto la <a href="{{ "legal/privacitat/" | relLangURL }}">política de privacitat</a>. Les dades facilitades s'usaran únicament per respondre la vostra consulta i no es cediran a tercers. <span class="form-requerit" aria-hidden="true">*</span></span>
        </label>
        <span class="form-error" id="c-rgpd-error" role="alert"></span>
      </div>

      {{/* Honeypot anti-spam: camp ocult, cap humà l'omple */}}
      <div class="form-honeypot" aria-hidden="true">
        <label for="c-web">No ompliu aquest camp</label>
        <input type="text" id="c-web" name="web" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-accions">
        <button class="form-btn" type="submit">Enviar missatge</button>
        <p class="form-nota"><span class="form-requerit" aria-hidden="true">*</span> Camps obligatoris</p>
      </div>
    </form>
  </section>

  {{ partial "formulari-correccio.html" . }}
</main>

<script>
(function () {
  'use strict';

  function validaEmail(val) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val.trim());
  }

  function mostrarError(input, errorEl, missatge) {
    input.setAttribute('aria-invalid', 'true');
    input.setAttribute('aria-describedby', errorEl.id);
    errorEl.textContent = missatge;
  }

  function netejaError(input, errorEl) {
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    errorEl.textContent = '';
  }

  function validaCamp(input, errorEl) {
    const val = input.value;
    if (input.type === 'checkbox') {
      if (!input.checked) {
        mostrarError(input, errorEl, 'Cal acceptar la política de privacitat per continuar.');
        return false;
      }
    } else if (!val.trim()) {
      mostrarError(input, errorEl, 'Aquest camp és obligatori.');
      return false;
    } else if (input.type === 'email' && !validaEmail(val)) {
      mostrarError(input, errorEl, 'Introduïu una adreça de correu electrònic vàlida.');
      return false;
    } else if (input.maxLength > 0 && val.length > input.maxLength) {
      mostrarError(input, errorEl, `Màxim ${input.maxLength} caràcters.`);
      return false;
    }
    netejaError(input, errorEl);
    return true;
  }

  function configuraFormulari(formId, camps) {
    const form = document.getElementById(formId);
    if (!form) return;

    camps.forEach(function (cfg) {
      const input = document.getElementById(cfg.id);
      const errorEl = document.getElementById(cfg.errorId);
      if (!input || !errorEl) return;
      input.addEventListener('blur', function () { validaCamp(input, errorEl); });
      input.addEventListener('input', function () {
        if (input.getAttribute('aria-invalid') === 'true') {
          validaCamp(input, errorEl);
        }
      });
    });

    form.addEventListener('submit', function (e) {
      let valid = true;

      /* Honeypot: si el camp ocult té valor, és un bot */
      const honeypot = form.querySelector('input[name="web"]');
      if (honeypot && honeypot.value) {
        e.preventDefault();
        return;
      }

      camps.forEach(function (cfg) {
        const input = document.getElementById(cfg.id);
        const errorEl = document.getElementById(cfg.errorId);
        if (!input || !errorEl) return;
        if (!validaCamp(input, errorEl)) valid = false;
      });

      if (!valid) {
        e.preventDefault();
        const primerError = form.querySelector('[aria-invalid="true"]');
        if (primerError) primerError.focus();
      }
    });
  }

  configuraFormulari('form-contacte', [
    { id: 'c-nom',     errorId: 'c-nom-error'     },
    { id: 'c-email',   errorId: 'c-email-error'   },
    { id: 'c-missatge',errorId: 'c-missatge-error' },
    { id: 'c-rgpd',    errorId: 'c-rgpd-error'    },
  ]);
}());
</script>
{{ end }}
