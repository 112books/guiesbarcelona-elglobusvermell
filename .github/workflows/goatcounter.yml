name: Fetch GoatCounter stats

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 hores (00, 06, 12, 18 UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Build analytics.json
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GC_SITE:  ${{ secrets.GOATCOUNTER_SITE }}
          DAYS:     '365'
        run: python scripts/build-stats.py

      - name: Commit stats
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/admin/stats/analytics.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "stats: actualització automàtica $(date -u +%Y-%m-%dT%H:%M)Z"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy-prod.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
