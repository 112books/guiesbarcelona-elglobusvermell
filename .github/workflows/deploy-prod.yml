name: Deploy → Producció (GitHub Pages)

on:
  push:
    branches: [main]
  # El fetch de stats committeja amb el GITHUB_TOKEN: GitHub no encadena
  # workflows en aquests pushes, així que el deploy s'ha de disparar
  # explícitament quan acaba el fetch (llavors construeix el main ja actualitzat).
  workflow_run:
    workflows: ["Fetch GoatCounter stats"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Només aquest job pot pujar commits (els del renom automàtic, scripts/renom.py);
    # la resta de jobs continuen amb contents: read.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Si en Xavi (Sveltia) ha canviat el títol d'una fitxa o d'un arquitecte, aquí es
      # deixa tot coherent (adreça, alias, fitxes) ABANS de construir. Si falla o hi ha un
      # conflicte, el job falla abans de Hugo i es manté l'últim desplegament bo.
      # `github.event.before` només existeix en `push`; en la resta, el script fa servir
      # HEAD~20 i el registre (.ai/REGISTRE-CANVIS-FITXES.md) evita processar dos cops.
      - name: Renomena fitxes i arquitectes (si s'ha canviat un títol)
        id: renom
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/renom.py run --repo . --base "$BEFORE" --cap HEAD \
            --avisos-json "$RUNNER_TEMP/avisos-renom.json"

      # Avís per correu: mai no atura el desplegament. Si els secrets no hi són, s'omet.
      - name: Envia l'avís per correu
        if: always()
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AVIS_DESTINATARIS: ${{ secrets.AVIS_DESTINATARIS }}
        run: python3 scripts/renom.py envia-avisos "$RUNNER_TEMP/avisos-renom.json"

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            wget -q https://github.com/gohugoio/hugo/releases/download/v0.159.0/hugo_extended_0.159.0_linux-amd64.tar.gz && break
            echo "Intent $i fallat, reintentant..." && sleep 5
          done
          tar -xzf hugo_extended_0.159.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Els editors pugen les fotos tal com les tenen: aquí les ajustem abans
      # de publicar-les (max. 1600 px d'amplada i 400 KB), i regenerem les
      # dimensions que fa servir single.html per als atributs width/height.
      - name: Redimensiona les imatges
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 scripts/redimensiona-imatges.py
          python3 scripts/genera-portades-mitjanes.py --totes
          python3 scripts/genera-dims-imatges.py

      # El tauler de revisió (/admin/revisio/) diu a la capçalera quina data i hora
      # reflecteix. S'agafa del commit que va tocar tasques.json, així no depèn
      # que ens en recordem. Si no ho pot esbrinar, deixa el valor del fitxer.
      - name: Data de la darrera actualització del tauler
        run: python3 scripts/estampa_tauler.py

      - name: Build Hugo
        run: hugo --minify --environment staging

      - name: Comprova el CSS crític
        run: python3 scripts/comprova-css.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
