name: Deploy → Producció (GitHub Pages)

on:
  push:
    branches: [main]
  # El fetch de stats committeja amb el GITHUB_TOKEN: GitHub no encadena
  # workflows en aquests pushes, així que el deploy s'ha de disparar
  # explícitament quan acaba el fetch (llavors construeix el main ja actualitzat).
  workflow_run:
    workflows: ["Fetch GoatCounter stats"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            wget -q https://github.com/gohugoio/hugo/releases/download/v0.159.0/hugo_extended_0.159.0_linux-amd64.tar.gz && break
            echo "Intent $i fallat, reintentant..." && sleep 5
          done
          tar -xzf hugo_extended_0.159.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Els editors pugen les fotos tal com les tenen: aquí les ajustem abans
      # de publicar-les (max. 1600 px d'amplada i 400 KB), i regenerem les
      # dimensions que fa servir single.html per als atributs width/height.
      - name: Redimensiona les imatges
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 scripts/redimensiona-imatges.py
          python3 scripts/genera-portades-mitjanes.py --totes
          python3 scripts/genera-dims-imatges.py

      - name: Build Hugo
        run: hugo --minify --environment staging

      - name: Comprova el CSS crític
        run: python3 scripts/comprova-css.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
