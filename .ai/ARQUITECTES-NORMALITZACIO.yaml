## Notes

- Aquesta llista només tracta **variants del mateix nom**.
- Els arquitectes **combinats amb altres** en una sola etiqueta (per exemple,
  "José Antonio Coderch de Sentmenat i Manuel Valls i Vergés") es tracten
  per separat a `.ai/ARQUITECTES-A-SEPARAR.md`.
- Si veieu errors o voleu canviar el nom canònic, editeu aquest fitxer.
