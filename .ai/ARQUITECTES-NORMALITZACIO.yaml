# Diccionari de normalització d'arquitectes — esborrany per revisar

Aquest fitxer agrupa les variants detectades del mateix arquitecte o estudi sota un
**nom canònic**. L'objectiu és evitar duplicats a la taxonomia (per exemple,
"Raimon Duran Reynals" i "Raimon Duran i Reynals" acabin sent la mateixa pàgina).

## Com s'aplicarà

Un cop revisat i aprovat, farem una passada automàtica per totes les fitxes
d'edifici (`content/ca/elements/*.md`) substituint cada variant pel seu nom
canònic. Hugo generarà llavors una única pàgina per arquitecte.

## Llista de normalitzacions proposades

```yaml
normalitzacions:
  - canonic: "Raimon Duran i Reynals"
    variants:
      - "Raimon Duran Reynals"

  - canonic: "Josep Alemany i Juvé"
    variants:
      - "Josep Alemany"

  - canonic: "Josep Graner i Prat"
    variants:
      - "Josep Graner Prat"

  - canonic: "Francesc Mitjans i Miró"
    variants:
      - "Francesc Mitjans"

  - canonic: "B720 Arquitectes"
    variants:
      - "B720 (Fermín Vázquez)"

  - canonic: "BAAS Arquitectura"
    variants:
      - "BAAS (Jordi Badia)"

  - canonic: "MBM Arquitectes"
    variants:
      - "MBM (Martorell, Bohigas, Mackay)"

  - canonic: "Miralles Tagliabue EMBT"
    variants:
      - "Enric Miralles i Benedetta Tagliabue"
      - "EMBT (Benedetta Tagliabue)"

  - canonic: "Haz Arquitectura"
    variants:
      - "HazArquitectura"

  - canonic: "José Antonio Coderch de Sentmenat"
    variants:
      - "José Antonio Coderch"

  - canonic: "Robert Terradas i Via"
    variants:
      - "Robert Terradas"

  - canonic: "Giráldez - López Íñigo - Subías Arquitectes"
    variants:
      - "G. Giráldez, P. López i J. Subias"

  - canonic: "Bayona Valero"
    variants:
      - "Bayona i Valero"

  - canonic: "Arriola & Fiol Arquitectes"
    variants:
      - "Arriola & Fiol"

## Notes

- Aquesta llista només tracta **variants del mateix nom**.
- Els arquitectes **combinats amb altres** en una sola etiqueta (per exemple,
  "José Antonio Coderch de Sentmenat i Manuel Valls i Vergés") es tracten
  per separat a `.ai/ARQUITECTES-A-SEPARAR.md`.
- Si veieu errors o voleu canviar el nom canònic, editeu aquest fitxer.
- **"Cantallops-Vicente" / "Lluís Cantallops" (exclòs, 2026-08-18):** Xavi confirma que
  "Lluís Cantallops" és una persona diferent de l'estudi "Cantallops Vicente Arquitectes"
  — no s'ha de fusionar. Tret d'aquesta llista.
- **"Antoni de Moragas i Gallissà i Francisco Riba(s) de Salas" (exclòs, 2026-08-18):**
  és un nom combinat de dos arquitectes, no una variant d'ortografia — es tracta a
  `.ai/ARQUITECTES-A-SEPARAR.md`, no aquí.
```
